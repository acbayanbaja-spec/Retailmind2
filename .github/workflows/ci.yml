name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/retailmind_ci?schema=public
          JWT_SECRET: ci-jwt-secret-min-32-characters-long!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars!!
          CORS_ORIGIN: http://localhost:3000

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/retailmind_ci?schema=public
          JWT_SECRET: ci-jwt-secret-min-32-characters-long!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars!!
          CORS_ORIGIN: http://localhost:3000

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
